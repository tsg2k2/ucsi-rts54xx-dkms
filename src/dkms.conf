PACKAGE_NAME="ucsi-rts54xx"
PACKAGE_VERSION="0.2"
BUILT_MODULE_NAME[0]="ucsi_rts54xx"
DEST_MODULE_LOCATION[0]="/updates"
MAKE[0]="make KVER=${kernelver} KDIR=${kernel_source_dir}"
CLEAN="make KVER=${kernelver} KDIR=${kernel_source_dir} clean"
# Only series with a bundled headers/<series>/ucsi.h
BUILD_EXCLUSIVE_KERNEL="^7\.[23]\."
AUTOINSTALL="yes"
